<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>anzar</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-left">
        <div class="logo">anzar</div>
        <nav class="topbar-nav">
          <button class="nav-btn active" data-view="today">Today</button>
          <button class="nav-btn" data-view="calendar">Calendar</button>
          <button class="nav-btn" data-view="notes">Notes</button>
          <button class="nav-btn" data-view="graph">Graph</button>
        </nav>
      </div>
      <div class="topbar-right">
        <span class="nav-meta" id="count-calendar" title="Tasks">0</span>
        <span class="nav-meta" id="count-notes" title="Notes">0</span>
        <button class="icon-btn" id="exportBtn" title="Export JSON">↓</button>
        <button class="icon-btn" id="themeToggle" title="Toggle theme">☀</button>
        <span class="db-version" id="db-version">v3</span>
      </div>
    </header>

    <main class="main" id="main-view">
      <!-- Views injected here -->
    </main>
  </div>

  <!-- Modal for new note / folder -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 class="modal-title" id="modalTitle">New Note</h3>
      <input type="text" class="modal-input" id="modalInput" placeholder="Name..." />
      <div class="modal-folder-group hidden" id="modalFolderGroup">
        <label class="modal-label">Folder (optional)</label>
        <select class="modal-select" id="modalFolderSelect"></select>
      </div>
      <div class="modal-actions">
        <button class="btn" id="modalCancel">Cancel</button>
        <button class="btn btn-primary" id="modalConfirm">Create</button>
      </div>
    </div>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
