<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anzar V2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="topbar-left">
                <div class="logo">Anzar</div>
                <span style="font-size: 10px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-left: 8px;">V2</span>
                <div class="topbar-nav">
                    <button class="nav-btn" data-view="today">Today</button>
                    <button class="nav-btn active" data-view="calendar">Calendar</button>
                    <button class="nav-btn" data-view="notes">Notes</button>
                    <button class="nav-btn" data-view="graph">Graph</button>
                </div>
            </div>
            <div class="topbar-right">
                <button class="icon-btn" id="helpBtn" title="Help">?</button>
                <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
                <button class="icon-btn" id="notificationsBtn" title="Notifications">🔔</button>
                <button class="icon-btn" id="exportBtn" title="Export">↓</button>
                <button class="icon-btn" id="themeToggle" title="Toggle theme">☀</button>
            </div>
        </header>
        <main class="main" id="main"></main>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">New Note</h3>
            <input type="text" id="modalInput" placeholder="Name...">
            <div class="modal-folder-group" id="modalFolderGroup">
                <label class="modal-label">Folder (optional)</label>
                <select id="modalFolderSelect">
                    <option value="">Root</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn" id="modalCancel">Cancel</button>
                <button class="btn btn-primary" id="modalConfirm">Create</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
